appId: io.gamehub.launcher
productName: GameHub
directories:
  buildResources: build
extraResources:
  - ludusavi
  - hydra-python-rpc
  - hydra-native
  - seeds
  # Bundle the console metadata + ROM catalogue so they load from disk instead
  # of depending on a live GitHub fetch (which left games with no art/desc).
  - from: sources/gamehub-meta
    to: gamehub-meta
  # GameHub Vault — community USA game/update/DLC dumps (direct hoster links).
  - from: Dump
    to: dump
  # RALibretro cores + default configs, copied into the install during setup.
  - from: resources/ralibretro
    to: ralibretro
  # Standalone controller tester/mapper pages (served via the controller-tester
  # protocol inside the emulation controller tab).
  - from: resources/controller-testers
    to: controller-testers
  - from: node_modules/create-desktop-shortcuts/src/windows.vbs
  - from: resources/achievement.wav
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!native/hydra-native/target"
  - "!native/hydra-native/target/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  # asdf-overlay ships a native injection DLL that must live on disk (not inside
  # the asar) so it can be injected into the game process by the overlay.
  - node_modules/@asdf-overlay/core/**
  - node_modules/sharp/**
  - node_modules/@img/sharp-libvips-*/**
win:
  executableName: GameHub
  icon: build/icon.ico
  extraResources:
    - from: binaries/7z.exe
    - from: binaries/7z.dll
    # PresentMon backs the in-game overlay's FPS / frame-time HUD (downloaded by
    # postinstall into ./presentmon). Directory form so a missing binary on a
    # non-overlay build doesn't fail packaging.
    - from: presentmon
      to: presentmon
    # Patched UKMM headless binary for BOTW mod install/deploy (built in CI).
    # Directory+filter form so a missing binary (build skipped/failed) doesn't
    # error packaging — the app just reports mod support as unavailable.
    - from: binaries
      to: .
      filter:
        - ukmm.exe
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: binaries/7zz
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  extraResources:
    - from: binaries/7zzs
    - from: binaries/umu/umu-run
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  category: Game
  mimeTypes:
    - x-scheme-handler/hydralauncher
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Kewz4
  repo: GameHub2026
  # Private release repo — records `private: true` in app-update.yml so the
  # updater authenticates. The runtime token comes from setFeedURL (index.ts).
  private: true
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
