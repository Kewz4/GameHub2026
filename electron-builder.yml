appId: io.gamehub.launcher
productName: GameHub
directories:
  buildResources: build
extraResources:
  - ludusavi
  - hydra-python-rpc
  - hydra-native
  - seeds
  - from: binaries/bin
    to: bin
    filter:
      - legendary*
      - gogdl*
  # Bundle the console metadata + ROM catalogue so they load from disk instead
  # of depending on a live GitHub fetch (which left games with no art/desc).
  - from: sources/gamehub-meta
    to: gamehub-meta
  # GameHub Vault — community USA game/update/DLC dumps (direct hoster links).
  - from: Dump
    to: dump
  # RALibretro cores + default configs, copied into the install during setup.
  - from: resources/ralibretro
    to: ralibretro
  # Standalone controller tester/mapper pages (served via the controller-tester
  # protocol inside the emulation controller tab).
  - from: resources/controller-testers
    to: controller-testers
  # Pinned, checksum-verified standalone resolver. Unlike yt-dlp's generic Unix
  # zipapp, these platform assets do not depend on a system Python installation.
  - from: yt-dlp
    to: yt-dlp
    filter:
      - yt-dlp*
  - from: node_modules/create-desktop-shortcuts/src/windows.vbs
  - from: resources/achievement.wav
files:
  - "!**/.vscode/*"
  - "!src/*"
  # Native source and historical hook fixtures never belong in app.asar. The
  # built, compositor-safe addon is copied separately from ./hydra-native.
  - "!native{,/**}"
  - "!third_party/microsoft-detours{,/**}"
  - "!scripts/build-overlay-qa-supervisor.cjs"
  - "!scripts/qa-live-overlay-acceptance.mjs"
  - "!scripts/qa-live-overlay-policy.mjs"
  - "!scripts/qa-live-emulator-launch.mjs"
  - "!scripts/tests/qa-live-overlay-{acceptance,policy}.test.mjs"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  # The tool is copied once via win.extraResources. Excluding it from app.asar
  # prevents duplication and guarantees a local legacy config/key is not packed.
  - "!emulator-tool{,/**}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/@img/sharp-libvips-*/**
win:
  executableName: GameHub
  icon: build/icon.ico
  extraResources:
    - from: binaries/7z.exe
    - from: binaries/7z.dll
    # Steam emulator CLI + Goldberg bundle (assembled by
    # scripts/download-emulator-tool.cjs). Directory form so a missing tool on a
    # build that skipped the download doesn't fail packaging.
    - from: emulator-tool
      to: emulator-tool
      filter:
        - "**/*"
        - "!config.json"
        - "!TEMP/**"
        - "!**/*.pdb"
        - "!**/*.log"
    # PresentMon backs the in-game overlay's FPS / frame-time HUD (downloaded by
    # postinstall into ./presentmon). Directory form so a missing binary on a
    # non-overlay build doesn't fail packaging.
    - from: presentmon
      to: presentmon
    # Pinned LGPL media runtime for exact-window Windows Graphics Capture,
    # native NVENC encoding, and stream-copy joining. Chromium remains the
    # automatic compatibility capture path.
    - from: ffmpeg
      to: ffmpeg
      filter:
        - ffmpeg.exe
        - manifest.json
        - LICENSE-*.txt
    - from: resources/FFMPEG-NOTICE.txt
      to: ffmpeg/FFMPEG-NOTICE.txt
    # Patched UKMM headless binary for BOTW mod install/deploy (built in CI).
    # Directory+filter form so a missing binary (build skipped/failed) doesn't
    # error packaging — the app just reports mod support as unavailable.
    - from: binaries
      to: .
      filter:
        - ukmm.exe
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: binaries/7zz
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  executableName: io.gamehub.launcher
  icon: build/icon.png
  extraResources:
    - from: binaries/7zzs
    - from: binaries/umu/umu-run
    - from: binaries
      to: .
      filter:
        - ukmm
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: GameHub
  vendor: GameHub
  category: Game
  mimeTypes:
    - x-scheme-handler/hydralauncher
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libsdl2-2.0-0
    - pulseaudio-utils
    - ffmpeg
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - libsecret
    - SDL2
    - pulseaudio-utils
    - /usr/bin/ffmpeg
npmRebuild: false
publish:
  provider: github
  owner: Kewz4
  repo: GameHub2026
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
