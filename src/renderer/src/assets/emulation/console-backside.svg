<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- Console backside decorative illustration -->
  <rect width="320" height="200" rx="16" fill="currentColor" fill-opacity="0.04"/>
  <!-- Ventilation grilles -->
  <g stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="40" y1="60" x2="280" y2="60"/>
    <line x1="40" y1="74" x2="280" y2="74"/>
    <line x1="40" y1="88" x2="280" y2="88"/>
    <line x1="40" y1="102" x2="280" y2="102"/>
    <line x1="40" y1="116" x2="280" y2="116"/>
    <line x1="40" y1="130" x2="280" y2="130"/>
    <line x1="40" y1="144" x2="280" y2="144"/>
  </g>
  <!-- AV port -->
  <rect x="44" y="156" width="48" height="18" rx="4" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- Power connector -->
  <rect x="228" y="156" width="48" height="18" rx="4" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- USB ports -->
  <rect x="128" y="156" width="20" height="18" rx="3" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
  <rect x="154" y="156" width="20" height="18" rx="3" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- Serial number area -->
  <rect x="116" y="22" width="88" height="14" rx="3" fill="currentColor" fill-opacity="0.06"/>
</svg>
