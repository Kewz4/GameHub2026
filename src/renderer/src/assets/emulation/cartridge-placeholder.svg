<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <!-- cartridge body -->
  <rect x="10" y="20" width="100" height="120" rx="6" fill="#2a2a3a" stroke="#444466" stroke-width="1.5"/>
  <!-- top notch (for grip) -->
  <rect x="35" y="10" width="50" height="18" rx="4" fill="#2a2a3a" stroke="#444466" stroke-width="1.5"/>
  <!-- label area -->
  <rect x="18" y="36" width="84" height="76" rx="3" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="1"/>
  <!-- label shine -->
  <rect x="18" y="36" width="84" height="14" rx="3" fill="#22223a" opacity="0.5"/>
  <!-- decorative lines on label -->
  <line x1="28" y1="64" x2="92" y2="64" stroke="#3a3a6a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="28" y1="80" x2="92" y2="80" stroke="#3a3a6a" stroke-width="0.7" stroke-dasharray="3 4"/>
  <!-- controller / chip icon in center -->
  <rect x="46" y="86" width="28" height="18" rx="3" fill="#3a3a5a" stroke="#5a5a8a" stroke-width="1"/>
  <circle cx="52" cy="95" r="3" fill="#5a5a8a"/>
  <circle cx="68" cy="95" r="3" fill="#5a5a8a"/>
  <!-- connector contacts at bottom -->
  <rect x="22" y="148" width="8" height="8" rx="1" fill="#555577"/>
  <rect x="34" y="148" width="8" height="8" rx="1" fill="#555577"/>
  <rect x="46" y="148" width="8" height="8" rx="1" fill="#555577"/>
  <rect x="58" y="148" width="8" height="8" rx="1" fill="#555577"/>
  <rect x="70" y="148" width="8" height="8" rx="1" fill="#555577"/>
  <rect x="82" y="148" width="8" height="8" rx="1" fill="#555577"/>
  <rect x="94" y="148" width="4" height="8" rx="1" fill="#555577"/>
</svg>
